[package]
name = "rl-web"
description = "Leptos web client: amber terminal shell, phosphor arena, simulation in a Web Worker."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rl-web"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
rl-core.workspace = true
rl-envs.workspace = true
rl-tutorial.workspace = true
rl-theme.workspace = true
rl-agents.workspace = true
rl-training.workspace = true
serde.workspace = true
serde_json = "1"
leptos = { version = "0.8", features = ["csr"] }
gloo-worker = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "KeyboardEvent",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "DomTokenList",
  "Location",
  "UrlSearchParams",
  "Performance",
  "Storage",
  "DomRect",
  "MouseEvent",
  "Event",
  "EventTarget",
  "DomStringList",
  "IdbFactory",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbDatabase",
  "IdbObjectStore",
  "IdbTransaction",
  "IdbTransactionMode",
] }
